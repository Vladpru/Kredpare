name: Bug
description: Something does not work as specified
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior, with exact error text if short.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, inputs, synthetic data used. Never paste real data or secrets.
      value: |
        1.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
