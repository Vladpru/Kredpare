name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Throwaway service-container credentials, same as docker-compose.yml.
      DATABASE_URL: postgresql+psycopg://kredpare:kredpare@localhost:5433/kredpare
      REDIS_URL: redis://localhost:6380/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: kredpare
      S3_SECRET_ACCESS_KEY: kredpare-local
      S3_BUCKET: kredpare
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kredpare
          POSTGRES_PASSWORD: kredpare
          POSTGRES_DB: kredpare
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kredpare -d kredpare"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags after v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Service containers cannot pass a command, and MinIO needs `server /data`.
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint bash chainguard/minio:latest -c \
            "mc alias set local $S3_ENDPOINT_URL $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY && mc mb --ignore-existing local/$S3_BUCKET"
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Lint, types, import contracts
        run: make check
      - name: Migrations on a fresh database
        run: uv run --directory backend alembic upgrade head
      - name: Tests with coverage
        run: >-
          uv run --directory backend
          pytest --cov=kredpare --cov-report=term-missing --cov-report=xml
      - name: Datagen tests with coverage
        run: uv run --directory datagen pytest --cov=kredpare_datagen --cov-report=term-missing
      - name: Break detection eval (MVP S1)
        run: |
          uv run kredpare-datagen --seed 42 --out "$RUNNER_TEMP/dataset"
          uv run kredpare eval matching "$RUNNER_TEMP/dataset" --as-of 2026-09-08 --markdown
      - name: Rule explanation eval (MVP S2, S3)
        run: uv run kredpare eval rules "$RUNNER_TEMP/dataset" --as-of 2026-09-08 --markdown
