[project]
name = "kredpare"
version = "0.0.0"
description = "Reconciliation of files exchanged with counterparties, with a rules -> workflow -> agent cascade for breaks."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.108",
    "celery[redis]>=5.6",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "holidays>=0.105",
    "openai>=3.24.0",
    "pandera[polars]>=0.33.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=6.4,<6.5",  # kombu (Celery's Redis transport) requires redis<6.5
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kredpare = "kredpare.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.107",
    "celery-types>=0.26.0",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat it as first-party.
known-third-party = ["alembic"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = ".."  # the uv workspace environment lives at the repo root
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.importlinter]
root_package = "kredpare"

[[tool.importlinter.contracts]]
name = "core does not import domains"
type = "forbidden"
source_modules = ["kredpare.core"]
forbidden_modules = ["kredpare.domains"]
