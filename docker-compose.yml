# Local development infrastructure. Credentials here are for throwaway local
# containers only; ports are bound to 127.0.0.1. Postgres and Redis use
# non-default host ports (5433, 6380) so they do not clash with other projects.
name: kredpare

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kredpare
      POSTGRES_PASSWORD: kredpare
      POSTGRES_DB: kredpare
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kredpare -d kredpare"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # minio/minio is no longer published on Docker Hub; Chainguard's build only
  # offers a free :latest tag.
  minio:
    image: chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kredpare
      MINIO_ROOT_PASSWORD: kredpare-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # The image has no curl, wget, or grep; use bash builtins only.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3
          && [[ $$status == *' 200 '* ]]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the bucket. Run by `make up` after the services are healthy
  # (`up --wait` treats an exited container as a failure, hence the profile).
  minio-init:
    image: chainguard/minio:latest
    profiles: [init]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 kredpare kredpare-local
        && mc mb --ignore-existing local/kredpare
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
